<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestiaire du Canyon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Mise en page : liste des créatures par zone à gauche, scène 3D plein cadre à droite,
   commandes flottantes en bas de scène. Un seul univers visuel sombre (nuit de canyon). */
:root {
  --bg: #12111c;
  --panel: #1a1928;
  --panel-2: #242238;
  --line: #34314f;
  --fg: #f2f0ff;
  --muted: #a6a2c6;
  --gold: #ffc53d;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.side {
  overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.zone { display: flex; flex-direction: column; gap: 6px; }
.zone h2 { margin: 0; font: 600 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zone h2 span { display: block; font: 600 11px/1.3 var(--body); letter-spacing: .04em; text-transform: none; color: #7d79a3; margin-top: 2px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item {
  display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 10px; align-items: center;
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent; color: var(--fg);
  padding: 7px 10px; border-radius: 10px; cursor: pointer; font: inherit;
}
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--panel-2); border-color: var(--line); }
.item:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pip { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); grid-row: span 2; }
.item b { font: 600 15px/1.2 var(--display); }
.item small { grid-column: 2; color: var(--muted); font-size: 12px; }

.stage { position: relative; min-width: 0; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #2c2944 0%, #17162a 55%, #0e0d17 100%); }
.stage canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(420px, calc(100% - 32px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.hud h2 { margin: 0; font: 700 34px/1.05 var(--display); text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 99px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.tag.rarity { color: #14121f; border-color: transparent; }
.hud p { margin: 0; color: #d6d3ee; font-size: 14px; max-width: 46ch; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats strong { color: var(--fg); font-weight: 700; }

.controls {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(760px, calc(100% - 32px));
}
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.seg { display: inline-flex; background: rgba(20,19,32,.82); border: 1px solid var(--line); border-radius: 12px; padding: 3px; backdrop-filter: blur(6px); }
.seg button, .chip, .toggle {
  border: 0; background: transparent; color: var(--fg); font: 600 14px/1 var(--body); padding: 9px 13px; border-radius: 9px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--gold); color: #1b1608; }
.chip { background: rgba(20,19,32,.82); border: 1px solid var(--line); font-size: 12px; padding: 7px 10px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.toggle { background: rgba(20,19,32,.82); border: 1px solid var(--line); font-size: 12px; padding: 7px 10px; }
.toggle[aria-pressed="false"] { color: var(--muted); }
.ability-name { font: 600 13px/1 var(--display); color: var(--gold); letter-spacing: .02em; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 600 16px var(--display); pointer-events: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  .stage { height: 68vh; min-height: 420px; order: 1; }
  .side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .hud h2 { font-size: 26px; }
  .hud p { display: none; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Créatures">
    <div class="brand">
      <h1>Bestiaire du Canyon</h1>
      <p>21 créatures, 3 zones. Choisis une créature, son animation et sa mutation.</p>
    </div>
    <div id="zones"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="hud" aria-live="polite">
      <div class="tags" id="tags"></div>
      <h2 id="name">Chargement…</h2>
      <p id="desc"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="loading" id="loading">Chargement de la créature…</div>
    <div class="controls">
      <div class="row">
        <div class="seg" role="group" aria-label="Animation">
          <button id="anim-Idle" data-anim="Idle" aria-pressed="true">Repos</button>
          <button id="anim-Move" data-anim="Move" aria-pressed="false">Marche</button>
          <button id="anim-Ability" data-anim="Ability" aria-pressed="false">Capacité</button>
          <button id="anim-Still" data-anim="Still" aria-pressed="false">Figé</button>
        </div>
      </div>
      <div class="row"><span class="ability-name" id="abilityName"></span></div>
      <div class="row" id="mutations" role="group" aria-label="Mutation"></div>
      <div class="row">
        <button class="toggle" id="t-vfx" aria-pressed="true">Effets</button>
        <button class="toggle" id="t-outline" aria-pressed="true">Contours</button>
        <button class="toggle" id="t-rotate" aria-pressed="false">Rotation auto</button>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const RARITY = {
  Common: { label: "Commun", color: "#b0b8c4" },
  Uncommon: { label: "Inhabituel", color: "#62d270" },
  Rare: { label: "Rare", color: "#4098ff" },
  Epic: { label: "Épique", color: "#ac5cff" },
  Legendary: { label: "Légendaire", color: "#ffba34" },
  Mythic: { label: "Mythique", color: "#ff406c" },
};
const ZONES = [
  { id: "Surface", label: "1 · La Surface", sub: "Communs & Inhabituels" },
  { id: "PenteBrumeuse", label: "2 · La Pente Brumeuse", sub: "Rares & Épiques" },
  { id: "GrottesCristal", label: "3 · Les Grottes de Cristal", sub: "Légendaires & Mythiques" },
];
const GAIT = { Quadruped: "Quadrupède", Sprawler: "Rampant", Flyer: "Vol", Serpent: "Serpent", Hover: "Lévitation" };
const KIND = { Nova: "Nova", Breath: "Souffle", Stomp: "Onde de choc", Burst: "Explosion", Eruption: "Éruption" };

// ---------------------------------------------------------------------------
// Scène
// ---------------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth < 760 ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xe8e6ff, 0x3a3550, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(6, 12, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const shadowGround = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

const toonRamp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter;
toonRamp.needsUpdate = true;

const MAT = {
  opaque: new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonRamp }),
  glass: new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonRamp, transparent: true, depthWrite: false }),
  neon: new THREE.MeshBasicMaterial({ vertexColors: true }),
  neonGlass: new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false }),
  outline: new THREE.MeshBasicMaterial({ color: 0x0c0b12, side: THREE.BackSide }),
};

// Géométries de base (non indexées, sans UV : fusionnables)
function wedgeGeometry() {
  const v = [[-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [0.5, -0.5, 0.5], [-0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5]];
  const tris = [[0, 2, 1], [0, 3, 2], [3, 5, 4], [3, 2, 5], [0, 4, 5], [0, 5, 1], [0, 3, 4], [1, 5, 2]];
  const pos = [];
  for (const t of tris) for (const i of t) pos.push(...v[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
function clean(g) {
  const out = g.index ? g.toNonIndexed() : g;
  out.deleteAttribute("uv");
  return out;
}
const GEO = {
  Block: clean(new THREE.BoxGeometry(1, 1, 1)),
  Wedge: wedgeGeometry(),
  Ball: clean(new THREE.IcosahedronGeometry(0.5, 1)),
  Cylinder: clean(new THREE.CylinderGeometry(0.5, 0.5, 1, 12).rotateZ(-Math.PI / 2)),
};

// Les listes vides sont exportées en {} : on les normalise
const arr = x => (Array.isArray(x) ? x : []);
function cfMatrix(c) {
  return new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
}
function partMatrix(p, grow = 0) {
  let s = p.s;
  if (p.k === "Ball") { const d = Math.min(...s); s = [d, d, d]; }
  if (p.k === "Cylinder") { const d = Math.min(s[1], s[2]); s = [s[0], d, d]; }
  return cfMatrix(p.c).multiply(new THREE.Matrix4().makeScale(s[0] + grow, s[1] + grow, s[2] + grow));
}
const tmpColor = new THREE.Color();
function linearRGB(rgb255) {
  tmpColor.setRGB(rgb255[0] / 255, rgb255[1] / 255, rgb255[2] / 255, THREE.SRGBColorSpace);
  return [tmpColor.r, tmpColor.g, tmpColor.b];
}

// ---------------------------------------------------------------------------
// Mutations (même algorithme que src/shared/Mutations.luau)
// ---------------------------------------------------------------------------
let mutations = [];
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
function mutate(p, along, m) {
  if (!m) return p;
  const [r, g, b] = p.col.map(x => x / 255);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  const neon = p.m === "Neon";
  let col, mat = p.m, t = p.t;
  if (m.rainbow) col = hsv((along * 0.85 + lum * 0.15) % 1, neon ? 0.45 : 0.78, 0.45 + 0.55 * Math.sqrt(lum)).map(x => x * 255);
  else if (neon) col = m.glow;
  else {
    const x = Math.pow(lum, 0.85) * (m.ramp.length - 1), i = Math.min(Math.floor(x), m.ramp.length - 2), f = x - i;
    col = m.ramp[i].map((c, k) => c + (m.ramp[i + 1][k] - c) * f);
  }
  if (m.material && !neon) {
    mat = m.material;
    const l2 = (0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2]) / 255;
    if (m.transparency && l2 > 0.55) t = Math.max(t, m.transparency);
  }
  return { ...p, col, m: mat, t };
}

// ---------------------------------------------------------------------------
// Particules, rayons, traînées
// ---------------------------------------------------------------------------
function makeTex(kind) {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = stops => {
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    stops.forEach(([o, col]) => r.addColorStop(o, col));
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
  };
  if (kind === "sparkle") {
    grad([[0, "rgba(255,255,255,1)"], [0.22, "rgba(255,255,255,0.45)"], [1, "rgba(255,255,255,0)"]]);
    g.fillStyle = "rgba(255,255,255,0.95)";
    g.beginPath();
    g.moveTo(32, 2); g.lineTo(35, 29); g.lineTo(62, 32); g.lineTo(35, 35);
    g.lineTo(32, 62); g.lineTo(29, 35); g.lineTo(2, 32); g.lineTo(29, 29);
    g.closePath();
    g.fill();
  } else if (kind === "spark") {
    grad([[0, "rgba(255,255,255,1)"], [0.3, "rgba(255,255,255,0.7)"], [1, "rgba(255,255,255,0)"]]);
  } else if (kind === "fire") {
    grad([[0, "rgba(255,255,255,0.95)"], [0.45, "rgba(255,255,255,0.5)"], [1, "rgba(255,255,255,0)"]]);
  } else {
    grad([[0, "rgba(255,255,255,0.65)"], [0.55, "rgba(255,255,255,0.3)"], [1, "rgba(255,255,255,0)"]]);
  }
  return new THREE.CanvasTexture(c);
}
const PTEX = {};
for (const k of ["sparkle", "spark", "fire", "smoke"]) PTEX[k] = makeTex(k);
const PVERT = `attribute float psize; attribute vec4 pcolor; varying vec4 vColor; uniform float pxScale;
void main() { vColor = pcolor; vec4 mv = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = psize * pxScale / max(-mv.z, 0.01); gl_Position = projectionMatrix * mv; }`;
const PFRAG = `uniform sampler2D map; varying vec4 vColor;
void main() { vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vColor.rgb * t.rgb, vColor.a * t.a); }`;
function evalSeq(seq, t) {
  for (let i = 0; i < seq.length - 1; i++) {
    const a = seq[i], b = seq[i + 1];
    if (t <= b[0]) {
      const f = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
      return a.slice(1).map((v, k) => v + (b[k + 1] - v) * f);
    }
  }
  return seq[seq.length - 1].slice(1);
}
const DIRS = { Top: [0, 1, 0], Bottom: [0, -1, 0], Front: [0, 0, -1], Back: [0, 0, 1], Right: [1, 0, 0], Left: [-1, 0, 0] };
const V = () => new THREE.Vector3();

class Emitter {
  // e : définition exportée ; anchor : objet 3D dont la matrice monde porte l'émetteur ; local : matrice locale
  constructor(e, anchor, local) {
    this.e = e;
    this.anchor = anchor;
    this.local = local;
    this.m = new THREE.Matrix4();
    this.rate = e.rate;
    this.max = Math.max(4, Math.min(900, Math.ceil(Math.max(e.rate, 1) * e.life[1] * 1.3) + (e.burst || 0) + 2));
    this.p = [];
    this.acc = 0;
    this.pos = new Float32Array(this.max * 3);
    this.col = new Float32Array(this.max * 4);
    this.size = new Float32Array(this.max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("pcolor", new THREE.BufferAttribute(this.col, 4));
    geo.setAttribute("psize", new THREE.BufferAttribute(this.size, 1));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: PTEX[e.tex] || PTEX.sparkle }, pxScale: { value: 600 } },
      vertexShader: PVERT, fragmentShader: PFRAG, transparent: true, depthWrite: false,
      blending: e.le >= 0.5 ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.obj = new THREE.Points(geo, this.mat);
    this.obj.frustumCulled = false;
  }
  frame() {
    this.m.multiplyMatrices(this.anchor.matrixWorld, this.local);
    const d = new THREE.Vector3(...(DIRS[this.e.dir] || DIRS.Top)).transformDirection(this.m);
    const ax = new THREE.Vector3(1, 0, 0).transformDirection(this.m);
    const a1 = Math.abs(d.dot(ax)) > 0.9 ? new THREE.Vector3(0, 1, 0).transformDirection(this.m) : ax;
    this.dir = d;
    this.b2 = V().crossVectors(d, a1).normalize();
    this.b1 = V().crossVectors(this.b2, d).normalize();
  }
  spawn() {
    const e = this.e;
    const pos = new THREE.Vector3((Math.random() - 0.5) * e.s[0], (Math.random() - 0.5) * e.s[1], (Math.random() - 0.5) * e.s[2]).applyMatrix4(this.m);
    const d = this.dir.clone()
      .applyAxisAngle(this.b1, THREE.MathUtils.degToRad(e.spread[0]) * (Math.random() * 2 - 1))
      .applyAxisAngle(this.b2, THREE.MathUtils.degToRad(e.spread[1]) * (Math.random() * 2 - 1));
    const speed = e.speed[0] + Math.random() * (e.speed[1] - e.speed[0]);
    this.p.push({ pos, vel: d.multiplyScalar(speed), age: 0, life: e.life[0] + Math.random() * (e.life[1] - e.life[0]) });
  }
  burst(n) {
    this.frame();
    for (let i = 0; i < n && this.p.length < this.max; i++) this.spawn();
  }
  step(dt) {
    this.frame();
    this.acc += this.rate * dt;
    while (this.acc >= 1 && this.p.length < this.max) { this.spawn(); this.acc -= 1; }
    if (this.p.length >= this.max) this.acc = 0;
    const acc = new THREE.Vector3(...this.e.acc), drag = Math.pow(0.5, this.e.drag * dt);
    this.p = this.p.filter(q => (q.age += dt) < q.life);
    for (const q of this.p) { q.vel.addScaledVector(acc, dt).multiplyScalar(drag); q.pos.addScaledVector(q.vel, dt); }
  }
  write(pxScale) {
    const e = this.e;
    this.mat.uniforms.pxScale.value = pxScale;
    for (let i = 0; i < this.max; i++) {
      const q = this.p[i];
      if (!q) { this.size[i] = 0; this.col[i * 4 + 3] = 0; continue; }
      const t = q.age / q.life, c = evalSeq(e.col, t);
      this.pos.set([q.pos.x, q.pos.y, q.pos.z], i * 3);
      this.col.set([c[0], c[1], c[2], 1 - evalSeq(e.tr, t)[0]], i * 4);
      this.size[i] = evalSeq(e.size, t)[0];
    }
    const g = this.obj.geometry;
    g.attributes.position.needsUpdate = g.attributes.pcolor.needsUpdate = g.attributes.psize.needsUpdate = true;
  }
}

// Ruban orienté caméra (rayons et traînées)
class Ribbon {
  constructor(n, additive) {
    this.n = n;
    this.pos = new Float32Array(n * 6);
    this.col = new Float32Array(n * 8);
    const idx = [];
    for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const geo = new THREE.BufferGeometry();
    geo.setIndex(idx);
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(this.col, 4));
    this.obj = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    }));
    this.obj.frustumCulled = false;
  }
  setPoint(i, p, side, rgb, a) {
    this.pos.set([p.x + side.x, p.y + side.y, p.z + side.z, p.x - side.x, p.y - side.y, p.z - side.z], i * 6);
    this.col.set([rgb[0], rgb[1], rgb[2], a, rgb[0], rgb[1], rgb[2], a], i * 8);
  }
  commit() {

// Créature : os (groupes), géométrie fusionnée par os, effets

const holder = new THREE.Group();

scene.add(holder, fxGroup);

function buildCreature(data, mutationId) {
  const mutation = mutations.find(m => m.id === mutationId);
  const root = new THREE.Group();
  const bones = {};
  for (const b of data.bones) {
    const g = new THREE.Group();
    g.matrixAutoUpdate = false;
    const rest = cfMatrix(b.c);
    bones[b.n] = { name: b.n, parent: b.p, g, rest, restInv: rest.clone().invert(), c0: new THREE.Matrix4() };
  }
  for (const b of Object.values(bones)) {
    if (b.parent && bones[b.parent]) {

      bones[b.parent].g.add(b.g);
    } else {
      b.c0.copy(b.rest);
      root.add(b.g);
    }

  }
  const boneOf = name => bones[name] || bones.Root;

  const box = new THREE.Box3();
  const center = V(), body = new THREE.Box3();
  for (const p0 of data.parts) {
    const p = mutate(p0, (p0.c[2] - zMin) / Math.max(zMax - zMin, 0.01), mutation);
    const bone = boneOf(p.b);
    const world = partMatrix(p);
    const g = GEO[p.k] || GEO.Block;
    const geo = g.clone().applyMatrix4(bone.restInv.clone().multiply(world));
    const neon = p.m === "Neon";
    const rgb = linearRGB(p.col).map(v => neon ? Math.min(1, v * 1.35) : v);
    const alpha = p.m === "Glass" ? Math.min(1 - p.t, 0.6) : 1 - p.t;
    const n = geo.attributes.position.count, cols = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) cols.set([rgb[0], rgb[1], rgb[2], alpha], i * 4);

    const kind = neon ? (alpha < 0.98 ? "neonGlass" : "neon") : (alpha < 0.98 ? "glass" : "opaque");
    const key = p.b + "|" + kind;
    if (!buckets.has(key)) buckets.set(key, { bone, kind, list: [] });
    buckets.get(key).list.push(geo);
    const pos = V().setFromMatrixPosition(world);
    box.expandByPoint(pos);
    if (!p.b.startsWith("Aura")) body.expandByPoint(pos);
    if (p.t < 0.5) {
      const w = Math.min(0.03, 0.2 * Math.min(...p.s));
      const hull = g.clone().applyMatrix4(bone.restInv.clone().multiply(partMatrix(p, w)));
      const hk = p.b + "|outline";
      if (!buckets.has(hk)) buckets.set(hk, { bone, kind: "outline", list: [] });
      buckets.get(hk).list.push(hull);
    }
  }
  const outlines = [];
  for (const { bone, kind, list } of buckets.values()) {
    if (kind === "outline") for (const gg of list) gg.deleteAttribute("color");
    const mesh = new THREE.Mesh(mergeGeometries(list, false), MAT[kind]);
    mesh.castShadow = kind === "opaque";
    mesh.receiveShadow = kind === "opaque";
    if (kind === "outline") { mesh.visible = showOutline; outlines.push(mesh); }
    bone.g.add(mesh);
  }
  body.getCenter(center);

  // Effets attachés aux os
  const fx = { emitters: [], beams: [], trails: [], lights: [] };
  const fxRoot = new THREE.Group();
  const local = (bone, c) => bone.restInv.clone().multiply(cfMatrix(c));
  for (const e of arr(data.fx.emitters)) {
    const bone = boneOf(e.b);
    const em = new Emitter(e, bone.g, local(bone, e.c));
    fx.emitters.push(em);
    fxRoot.add(em.obj);
  }
  for (const b of arr(data.fx.beams)) {
    const b0 = boneOf(b.b0), b1 = boneOf(b.b1);
    const bm = new BeamFx(b, b0.g, local(b0, b.p0), b1.g, local(b1, b.p1));
    fx.beams.push(bm);
    fxRoot.add(bm.obj);
  }
  for (const t of arr(data.fx.trails)) {
    const bone = boneOf(t.b);
    const tr = new TrailFx(t, bone.g, V().fromArray(t.p0).applyMatrix4(bone.restInv), V().fromArray(t.p1).applyMatrix4(bone.restInv));
    fx.trails.push(tr);
    fxRoot.add(tr.obj);
  }
  for (const l of arr(data.fx.lights).slice(0, 6)) {
    const bone = boneOf(l.bone);
    tmpColor.setRGB(l.col[0] / 255, l.col[1] / 255, l.col[2] / 255, THREE.SRGBColorSpace);
    const pl = new THREE.PointLight(tmpColor.clone(), l.b * 2.5, l.range * 1.2, 1);
    pl.position.copy(V().fromArray(l.p).applyMatrix4(bone.restInv));
    bone.g.add(pl);
    fx.lights.push({ light: pl, base: pl.intensity });

  if (data.ability && data.ability.origin) {
    const bone = boneOf(data.ability.origin.b);
    abilityOrigin = { g: bone.g, local: local(bone, data.ability.origin.c) };
  }

  const auras = Object.values(bones).filter(b => b.name.startsWith("Aura")).sort((a, b) => a.name.localeCompare(b.name));
  return {
    data, root, bones, fx, fxRoot, outlines, box, center, abilityOrigin, auras,
    profile: profileOf(data.anim || {}),
    st: { t: Math.random() * 50, move: 0, earTimer: 1, earSide: 1, sniffTimer: 2, tongueTimer: 1.5, abilityT: -1 },
  };
}

    gait: a.gait || "Quadruped", breathe: a.breathe ?? 0.03, sway: a.sway ?? 8, tongueFlick: !!a.tongueFlick,
    bob: a.bob ?? 0.08, stride: a.stride ?? 30, strideRate: a.strideRate ?? 10, tailSway: a.tailSway ?? 12,
    tailRate: a.tailRate ?? 2, headLook: a.headLook ?? 15, sniff: !!a.sniff, earTwitch: !!a.earTwitch,
    flap: a.flap ?? 35, flapRate: a.flapRate ?? 6, hover: a.hover ?? 0.15, auraSpeed: a.auraSpeed ?? 0.6, flicker: a.flicker ?? 0,

  const sniff = p.sniff && st.sniffTimer < 0 ? Math.sin(t * 38) * rad(2.5) : 0;

  if (p.earTwitch) {

  tails.forEach((name, i) => {

  cr.auras.forEach((b, i) => {

    flash(ground, R, c1, 0.6);
  } else if (a.kind === "Burst") {
    dome(body, R * 0.6, c1, 0.7);
    oneShot(world, at(body), spec(a.texture, [c3, c1, c2], 0.35, 16, 180, 1.0), 60);
    shockwave(ground, R, c2, 0.8);
    flash(body, R, c1, 0.7);
  } else if (a.kind === "Eruption") {
    oneShot(world, at(body), spec("fire", [c3, c1, c2], 0.9, 22, 25, 1.4, [0, -14, 0]), 50);
    oneShot(world, at(body), spec("spark", [c3, c1], 0.25, 26, 35, 1.8, [0, -10, 0]), 40);
    shockwave(ground, R, c1, 1.0);
    flash(body, R * 1.5, c1, 1.0);
  } else {
    dome(body, R * 0.8, c1, 0.8);
    setTimeout(() => dome(body, R, c2, 0.9), 120);
    shockwave(ground, R * 1.2, c1, 1.0);
    oneShot(world, at(body), spec(a.texture, [c3, c1, c2], 0.5, 18, 180, 1.2), 70);
    flash(body, R * 1.5, c1, 0.9);
  }
}
function stepTransient(dt) {
  for (let i = transient.length - 1; i >= 0; i--) {
    const tr = transient[i];
    tr.t += dt;
    const k = Math.min(1, tr.t / tr.duration);
    tr.update(k, dt, tr.t);
    if (tr.t >= tr.duration) {
      fxGroup.remove(tr.obj);
      tr.obj.geometry?.dispose();
      transient.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------------------
// Interface
// ---------------------------------------------------------------------------
let index = [];
const cache = new Map();
let currentId = null, currentMutation = "";
let showFx = true;

function pxScale() {
  return renderer.domElement.height / (2 * Math.tan(rad(camera.fov / 2)));
}

function setAnim(name) {
  animState = name === "Ability" ? animState : name;
  document.querySelectorAll("[data-anim]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.anim === (name === "Ability" ? "Ability" : animState))));
}

function renderList() {
  const zones = document.getElementById("zones");
  zones.innerHTML = "";
  for (const z of ZONES) {
    const sec = document.createElement("section");
    sec.className = "zone";
    sec.innerHTML = `<h2>${z.label}<span>${z.sub}</span></h2>`;
    const list = document.createElement("div");
    list.className = "list";
    for (const c of index.filter(c => c.zone === z.id)) {
      const b = document.createElement("button");
      b.className = "item";
      b.id = "item-" + c.id;
      b.innerHTML = `<i class="pip" style="background:${RARITY[c.rarity].color}"></i><b>${c.name}</b><small>${RARITY[c.rarity].label} · ${GAIT[c.gait] || ""}</small>`;
      b.onclick = () => { location.hash = c.id; };
      list.appendChild(b);
    }
    sec.appendChild(list);
    zones.appendChild(sec);
  }
}

function renderMutations() {
  const row = document.getElementById("mutations");
  row.innerHTML = "";
  const all = [{ id: "", label: "Normal", glow: [220, 220, 235] }, ...mutations];
  for (const m of all) {
    const b = document.createElement("button");
    b.className = "chip";
    b.id = "mut-" + (m.id || "none");
    b.setAttribute("aria-pressed", String(m.id === currentMutation));
    const c = m.rainbow ? "conic-gradient(#ff5a5a,#ffdc3c,#50dc78,#4696ff,#be5aff,#ff5a5a)" : `rgb(${m.glow.join(",")})`;
    b.innerHTML = `<i style="background:${c}"></i>${m.label[0] + m.label.slice(1).toLowerCase()}${m.multiplier ? " ×" + m.multiplier : ""}`;
    b.onclick = () => { currentMutation = m.id; renderMutations(); show(currentId, true); };
    row.appendChild(b);
  }
}

function fit(cr) {
  const size = cr.box.getSize(V()), c = cr.box.getCenter(V());
  const r = Math.max(size.length() / 2, 1);
  const dist = r / Math.sin(rad(camera.fov / 2)) * 0.78;
  const dir = new THREE.Vector3(0.78, 0.42, -1).normalize();
  c.y -= r * 0.18; // la créature remonte à l'écran, au-dessus des commandes
  camera.position.copy(c).addScaledVector(dir, dist);
  controls.target.copy(c);
  controls.update();
}

async function loadData(id) {
  if (!cache.has(id)) cache.set(id, fetch(`${id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));
  return cache.get(id);
}

async function show(id, keepCamera = false) {
  if (!id) return;
  currentId = id;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", String(b.id === "item-" + id)));
  document.getElementById("loading").hidden = false;
  let data;
  try {
    data = await loadData(id);
  } catch (err) {
    document.getElementById("loading").textContent = "Impossible de charger cette créature. Recharge la page.";
    return;
  }
  if (id !== currentId) return;
  if (creature) {
    holder.remove(creature.root);
    fxGroup.remove(creature.fxRoot);
  }
  creature = buildCreature(data, currentMutation);
  holder.add(creature.root);
  creature.fxRoot.visible = showFx;
  fxGroup.add(creature.fxRoot);
  holder.updateMatrixWorld(true);
  for (let k = 0; k < 60; k++) for (const em of creature.fx.emitters) em.step(1 / 30);
  if (!keepCamera) fit(creature);
  const meta = index.find(c => c.id === id) || {};
  const rar = RARITY[data.rarity];
  const h = creature.box.getSize(V()).y;
  document.getElementById("name").textContent = data.name;
  document.getElementById("desc").textContent = data.description || "";
  document.getElementById("tags").innerHTML =
    `<span class="tag rarity" style="background:${rar.color}">${rar.label}</span>` +
    `<span class="tag">${(ZONES.find(z => z.id === data.zone) || {}).label?.replace(/^\d · /, "") || ""}</span>` +
    `<span class="tag">${GAIT[meta.gait] || ""}</span>`;
  document.getElementById("stats").innerHTML =
    `<span><strong>${data.parts.length.toLocaleString("fr-FR")}</strong> pièces</span>` +
    `<span><strong>${(h * data.scale).toFixed(1)}</strong> studs de haut en jeu</span>` +
    `<span><strong>${arr(data.fx.emitters).length + arr(data.fx.beams).length + arr(data.fx.trails).length}</strong> effets</span>`;
  document.getElementById("abilityName").textContent = data.ability ? `Capacité : ${data.ability.name} (${KIND[data.ability.kind] || data.ability.kind})` : "";
  document.getElementById("loading").hidden = true;
  document.title = `${data.name} · Bestiaire du Canyon`;
}

document.querySelectorAll("[data-anim]").forEach(b => b.onclick = () => {
  if (b.dataset.anim === "Ability") {
    if (creature && creature.st.abilityT < 0) { playAbility(creature); setAnim("Ability"); }
  } else setAnim(b.dataset.anim);
});
const toggle = (id, fn) => {
  const b = document.getElementById(id);
  b.onclick = () => { const v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(v)); fn(v); };
};
toggle("t-vfx", v => { showFx = v; if (creature) creature.fxRoot.visible = v; });
toggle("t-outline", v => { showOutline = v; if (creature) creature.outlines.forEach(o => (o.visible = v)); });
toggle("t-rotate", v => { controls.autoRotate = v; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  controls.update();
  if (creature) {
    stepAnim(creature, dt);
    holder.updateMatrixWorld(true);
    if (showFx) {
      const px = pxScale();
      for (const em of creature.fx.emitters) { em.step(dt); em.write(px); }
      for (const bm of creature.fx.beams) bm.update(camera);
      const now = performance.now() / 1000;
      for (const tr of creature.fx.trails) tr.update(now);
    }
  }
  stepTransient(dt);
  renderer.render(scene, camera);
});

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
(async () => {
  try {
    [index, mutations] = await Promise.all([fetch("index.json").then(r => r.json()), fetch("mutations.json").then(r => r.json())]);
  } catch (err) {
    document.getElementById("loading").textContent = "Impossible de charger le bestiaire. Recharge la page.";
    return;
  }
  renderList();
  renderMutations();
  const start = location.hash.slice(1);
  await show(index.some(c => c.id === start) ? start : "LeviathanDesProfondeurs");
  window.__ready = true;
})();
</script>
