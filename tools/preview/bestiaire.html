<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestiaire du Tapis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Mise en page : liste des créatures par rareté à gauche, scène 3D plein cadre à droite,
   commandes flottantes en bas de scène. Un seul univers visuel sombre. */
:root {
  --bg: #12111c;
  --panel: #1a1928;
  --panel-2: #242238;
  --line: #34314f;
  --fg: #f2f0ff;
  --muted: #a6a2c6;
  --gold: #ffc53d;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.side {
  overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.zone { display: flex; flex-direction: column; gap: 6px; }
.zone h2 { margin: 0; font: 600 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zone h2 span { display: block; font: 600 11px/1.3 var(--body); letter-spacing: .04em; text-transform: none; color: #7d79a3; margin-top: 2px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item {
  display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 10px; align-items: center;
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent; color: var(--fg);
  padding: 7px 10px; border-radius: 10px; cursor: pointer; font: inherit;
}
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--panel-2); border-color: var(--line); }
.item:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pip { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); grid-row: span 2; }
.item b { font: 600 15px/1.2 var(--display); }
.item small { grid-column: 2; color: var(--muted); font-size: 12px; }

.stage { position: relative; min-width: 0; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #2c2944 0%, #17162a 55%, #0e0d17 100%); }
.stage canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(420px, calc(100% - 32px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.hud h2 { margin: 0; font: 700 34px/1.05 var(--display); text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 99px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.tag.rarity { color: #14121f; border-color: transparent; }
.tag.rarity.exotic, .pip.exotic { background-size: 200% 100% !important; animation: slide 3s linear infinite; }
.tag.rarity.exclusive { color: #ffd166; border: 1px solid #ffd166; }
.pip.exclusive { box-shadow: 0 0 0 1.5px #ffd166 inset; }
.tag.rarity.chaotic, .pip.chaotic { color: #fff; background-size: 300% 100% !important; animation: glitch .9s steps(3) infinite; }
@keyframes slide { to { background-position: 200% 0; } }
@keyframes glitch { 0% { background-position: 0 0; transform: translate(0); } 33% { background-position: 100% 0; transform: translate(1px, -1px); } 66% { background-position: 200% 0; transform: translate(-1px, 1px); } }
@media (prefers-reduced-motion: reduce) { .tag.rarity, .pip { animation: none !important; } }
.income { font: 600 13px/1.3 var(--body); color: #ffd166; }
.hud p { margin: 0; color: #d6d3ee; font-size: 14px; max-width: 46ch; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats strong { color: var(--fg); font-weight: 700; }

.controls {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(760px, calc(100% - 32px));
}
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.seg { display: inline-flex; background: rgba(20,19,32,.82); border: 1px solid var(--line); border-radius: 12px; padding: 3px; backdrop-filter: blur(6px); }
.seg button, .chip, .toggle {
  border: 0; background: transparent; color: var(--fg); font: 600 14px/1 var(--body); padding: 9px 13px; border-radius: 9px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--gold); color: #1b1608; }
.chip { background: rgba(20,19,32,.82); border: 1px solid var(--line); font-size: 12px; padding: 7px 10px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.toggle { background: rgba(20,19,32,.82); border: 1px solid var(--line); font-size: 12px; padding: 7px 10px; }
.toggle[aria-pressed="false"] { color: var(--muted); }
.ability-name { font: 600 13px/1 var(--display); color: var(--gold); letter-spacing: .02em; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 600 16px var(--display); pointer-events: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  .stage { height: 68vh; min-height: 420px; order: 1; }
  .side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .hud h2 { font-size: 26px; }
  .hud p { display: none; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Créatures">
    <div class="brand">
      <h1>Bestiaire du Tapis</h1>
      <p>10 tapis de course, 30 personnages (dont les 10 variétés du Néant Couronné), 8 raretés, 11 mutations cumulables.</p>
    </div>
    <div id="zones"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="hud" aria-live="polite">
      <div class="tags" id="tags"></div>
      <h2 id="name">Chargement…</h2>
      <p id="desc"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="loading" id="loading">Chargement de la créature…</div>
    <div class="controls">
      <div class="row">
        <div class="seg" role="group" aria-label="Animation">
          <button id="anim-Idle" data-anim="Idle" aria-pressed="true">Repos</button>
          <button id="anim-Move" data-anim="Move" aria-pressed="false">Marche</button>
          <button id="anim-Ability" data-anim="Ability" aria-pressed="false">Capacité</button>
          <button id="anim-Still" data-anim="Still" aria-pressed="false">Figé</button>
        </div>
      </div>
      <div class="row"><span class="ability-name" id="abilityName"></span></div>
      <div class="row"><span class="income" id="income"></span></div>
      <div class="row" id="mutations" role="group" aria-label="Mutation"></div>
      <div class="row">
        <button class="toggle" id="t-vfx" aria-pressed="true">Effets</button>
        <button class="toggle" id="t-outline" aria-pressed="true">Contours</button>
        <button class="toggle" id="t-rotate" aria-pressed="false">Rotation auto</button>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">

  Epic: { label: "Épique", color: "#a850ff", where: "Milieu du tapis · moyen" },
  Legendary: { label: "Légendaire", color: "#ffbe28", where: "Loin · peu fréquent" },
  Mythic: { label: "Mythique", color: "#ff283c", where: "Très loin · rare" },

  Exclusive: { label: "Exclusif", color: "linear-gradient(90deg,#0a080c,#3a2a06,#0a080c)", where: "Tout au bout + roue · 1 sur 50 000", cls: "exclusive" },
  Chaotic: { label: "Chaotique", color: "linear-gradient(90deg,#ff005a,#00ffe6,#7800ff,#ff005a)", where: "Tout au bout · 1 sur 1 000 000", cls: "chaotic" },

const ORDER = ["Common", "Rare", "Epic", "Legendary", "Mythic", "Exotic", "Exclusive", "Chaotic"];
const SIZE = { Small: "Petit", Medium: "Moyen", Large: "Grand", Giant: "Géant", Colossal: "Colossal" };
const SOURCE = { Tapis: "Sur le tapis", TapisEtRoue: "Tapis + roue", Roue: "Roue uniquement" };
const money = n => { for (const [v, u] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) if (n >= v) { const x = n / v; return (x >= 100 ? Math.floor(x) : Math.round(x * 10) / 10).toString().replace(".", ",") + u; } return String(Math.round(n)); };
const GAIT = { Quadruped: "Quadrupède", Sprawler: "Rampant", Flyer: "Vol", Serpent: "Serpent", Hover: "Lévitation", Biped: "Bipède" };
const KIND = { Nova: "Nova", Breath: "Souffle", Stomp: "Onde de choc", Burst: "Explosion", Eruption: "Éruption" };

// ---------------------------------------------------------------------------
// Scène
// ---------------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth < 760 ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xe8e6ff, 0x3a3550, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(6, 12, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const shadowGround = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

const toonRamp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter;
toonRamp.needsUpdate = true;

const MAT = {
  opaque: new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonRamp }),
  glass: new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonRamp, transparent: true, depthWrite: false }),
  neon: new THREE.MeshBasicMaterial({ vertexColors: true }),
  neonGlass: new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false }),
  outline: new THREE.MeshBasicMaterial({ color: 0x0c0b12, side: THREE.BackSide }),
  ghost: new THREE.MeshBasicMaterial({ color: 0x78dcff, transparent: true, opacity: 0.28, depthWrite: false, blending: THREE.AdditiveBlending }),
};

// Géométries de base (non indexées, sans UV : fusionnables)
function wedgeGeometry() {
  const v = [[-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [0.5, -0.5, 0.5], [-0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5]];
  const tris = [[0, 2, 1], [0, 3, 2], [3, 5, 4], [3, 2, 5], [0, 4, 5], [0, 5, 1], [0, 3, 4], [1, 5, 2]];
  const pos = [];
  for (const t of tris) for (const i of t) pos.push(...v[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
function clean(g) {
  const out = g.index ? g.toNonIndexed() : g;
  out.deleteAttribute("uv");
  return out;
}
const GEO = {
  Block: clean(new THREE.BoxGeometry(1, 1, 1)),
  Wedge: wedgeGeometry(),
  Ball: clean(new THREE.IcosahedronGeometry(0.5, 1)),
  Cylinder: clean(new THREE.CylinderGeometry(0.5, 0.5, 1, 12).rotateZ(-Math.PI / 2)),
};

// Les listes vides sont exportées en {} : on les normalise
const arr = x => (Array.isArray(x) ? x : []);
function cfMatrix(c) {
  return new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
}
function partMatrix(p, grow = 0) {
  let s = p.s;
  if (p.k === "Ball") { const d = Math.min(...s); s = [d, d, d]; }
  if (p.k === "Cylinder") { const d = Math.min(s[1], s[2]); s = [s[0], d, d]; }
  return cfMatrix(p.c).multiply(new THREE.Matrix4().makeScale(s[0] + grow, s[1] + grow, s[2] + grow));
}
const tmpColor = new THREE.Color();
function linearRGB(rgb255) {
  tmpColor.setRGB(rgb255[0] / 255, rgb255[1] / 255, rgb255[2] / 255, THREE.SRGBColorSpace);
  return [tmpColor.r, tmpColor.g, tmpColor.b];
}

// ---------------------------------------------------------------------------
// Mutations (portage de src/shared/Mutations.luau) : peinture + pièces ajoutées + effets animés
// ---------------------------------------------------------------------------
let mutations = [];
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][((i % 6) + 6) % 6];
}
const hsv255 = (h, s, v) => hsv(((h % 1) + 1) % 1, s, v).map(x => x * 255);
const RAMP = {
  stone: [[70, 72, 68], [116, 118, 110], [160, 160, 150], [200, 198, 186]],
  moss: [[40, 80, 30], [72, 118, 44], [112, 154, 60], [160, 192, 90]],
  porcelain: [[26, 50, 130], [104, 136, 200], [230, 234, 244], [252, 252, 255]],
  brass: [[70, 44, 18], [150, 100, 44], [214, 162, 80], [250, 220, 150]],
  heat: [[150, 60, 50], [230, 120, 70], [255, 190, 120], [255, 236, 200]],
  amber: [[110, 40, 8], [200, 100, 20], [250, 160, 40], [255, 214, 130]],
  night: [[4, 4, 12], [10, 10, 28], [20, 20, 54], [40, 40, 92]],
};
const GLASS6 = [[220, 30, 50], [30, 90, 230], [30, 170, 80], [255, 180, 30], [150, 50, 210], [30, 200, 210]];
function ramp(list, x) {
  const f = Math.min(Math.max(x, 0), 1) * (list.length - 1), i = Math.min(Math.floor(f), list.length - 2), k = f - i;
  return list[i].map((c, j) => c + (list[i + 1][j] - c) * k);
}
const auroraHue = (c, t) => 0.3 + 0.5 * (0.5 + 0.5 * Math.sin((c.along * 1.6 + c.height * 1.1) * Math.PI * 2 - t * 1.3));
const PAINT = {
  Mousse: (l, neon, c) => neon ? { col: [190, 255, 150] } : ((c.height > 0.48 && c.h < 0.62) || c.h < 0.14) ? { col: ramp(RAMP.moss, l ** 0.8), m: "Grass", t: 0 } : { col: ramp(RAMP.stone, l ** 0.8), m: "Slate", t: 0 },
  Kintsugi: (l, neon) => neon ? { col: [255, 205, 80] } : { col: ramp(RAMP.porcelain, l ** 0.7), m: "SmoothPlastic", t: 0 },
  Vitrail: (l, neon, c) => neon ? { col: [255, 250, 230] } : { col: GLASS6[c.cell - 1].map(x => x * (1 - 0.4 * (1 - l))), m: "Glass", t: 0.25 },
  Horloger: (l, neon) => neon ? { col: [255, 170, 60] } : { col: ramp(RAMP.brass, l), m: "Glass", t: 0.45 },
  Mirage: (l, neon) => neon ? { col: [255, 240, 210] } : { col: ramp(RAMP.heat, l), m: "SmoothPlastic", t: 0.2 },
  Encre: (l, neon) => (neon || l < 0.4) ? { col: [16, 16, 22], m: "SmoothPlastic", t: 0 } : { col: l < 0.62 ? [212, 206, 192] : [246, 242, 230], m: "SmoothPlastic", t: 0 },
  Aurore: (l, neon, c, t) => { const h = auroraHue(c, t); return neon ? { col: hsv255(h, 0.35, 1) } : { col: hsv255(h, 0.72, 0.3 + 0.7 * l), m: "SmoothPlastic", t: 0 }; },
  Fossile: (l, neon) => neon ? { col: [255, 190, 80] } : { col: ramp(RAMP.amber, l), m: "Glass", t: 0.45 },
  Constellation: (l, neon) => neon ? { col: [210, 225, 255] } : { col: ramp(RAMP.night, l), m: "SmoothPlastic", t: 0 },
  Paradoxe: (l, neon, c, t) => { const h = (c.along * 0.7 + c.height * 0.3 + t * 0.15) % 1; return neon ? { col: hsv255(h, 0.25, 1) } : { col: hsv255(h, 0.85, 0.3 + 0.7 * l), m: "SmoothPlastic", t: 0 }; },
};
const PARADOX_CYCLE = ["Constellation", "Vitrail", "Encre", "Aurore", "Kintsugi", "Fossile", "Mousse", "Horloger", "Mirage"];
const lumOf = col => (0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2]) / 255;
const fract = x => x - Math.floor(x);
const hash1 = x => fract(Math.sin(x * 12.9898) * 43758.5453);
function rng32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const isAura = b => b.startsWith("Aura") || b.startsWith("FX_");
// CFrame Roblox <-> matrices
const cfOf = m => { const e = m.elements; return [e[12], e[13], e[14], e[0], e[4], e[8], e[1], e[5], e[9], e[2], e[6], e[10]]; };
const cfAt = (x, y, z) => [x, y, z, 1, 0, 0, 0, 1, 0, 0, 0, 1];
function cfLook(pos, target) {
  const look = target.clone().sub(pos).normalize();
  let up = new THREE.Vector3(0, 1, 0);
  if (Math.abs(look.dot(up)) > 0.95) up = new THREE.Vector3(1, 0, 0);
  const right = new THREE.Vector3().crossVectors(look, up).normalize();
  const up2 = new THREE.Vector3().crossVectors(right, look).normalize();
  return [pos.x, pos.y, pos.z, right.x, up2.x, -look.x, right.y, up2.y, -look.y, right.z, up2.z, -look.z];
}
const partPos = p => new THREE.Vector3(p.c[0], p.c[1], p.c[2]);
function extentAlong(p, n) {
  const c = p.c;
  return 0.5 * (Math.abs(c[3] * n.x + c[6] * n.y + c[9] * n.z) * p.s[0] + Math.abs(c[4] * n.x + c[7] * n.y + c[10] * n.z) * p.s[1] + Math.abs(c[5] * n.x + c[8] * n.y + c[11] * n.z) * p.s[2]);
}
const mk = (b, n, k, c, s, col, m = "SmoothPlastic", t = 0) => ({ b, n, k, c, s, col, m, t });

/** Applique une liste de mutations aux données d'une créature (copie) : renvoie les pièces,
 *  os, effets ajoutés et les infos d'animation. */
function mutateData(data, ids) {
  const list = mutations.filter(m => ids.includes(m.id));
  const out = { parts: data.parts, bones: data.bones, emitters: [], beams: [], trails: [], lights: [], spin: {}, mirage: false, echo: false, dyn: null, ids: list.map(m => m.id) };
  if (!list.length) return out;
  const has = Object.fromEntries(list.map(m => [m.id, true]));
  const dom = [...list].reverse().find(m => m.recolor) || null;
  const bonePos = {}, parentOf = {}, hasChild = {};
  for (const b of data.bones) { bonePos[b.n] = new THREE.Vector3(b.c[0], b.c[1], b.c[2]); if (b.p) { parentOf[b.n] = b.p; hasChild[b.p] = true; } }
  // Contexte de peinture (même calcul que Mutations.buildCtx)
  const lo = new THREE.Vector3(Infinity, Infinity, Infinity), hi = lo.clone().negate();
  for (const p of data.parts) if (!isAura(p.b)) { const q = partPos(p), e = Math.hypot(...p.s) * 0.3; lo.min(q.clone().subScalar(e)); hi.max(q.clone().addScalar(e)); }
  const size = hi.clone().sub(lo), center = lo.clone().add(hi).multiplyScalar(0.5);

// Créature : os (groupes), géométrie fusionnée par os, effets
// ---------------------------------------------------------------------------

scene.add(holder, fxGroup);

function buildCreature(data, mutationIds = [], opts = {}) {
  const mut = mutateData(data, mutationIds);
  const root = new THREE.Group();
  const bones = {};
  for (const b of mut.bones) {
    const g = new THREE.Group();
    g.matrixAutoUpdate = false;
    const rest = cfMatrix(b.c);
    bones[b.n] = { name: b.n, parent: b.p, g, rest, restInv: rest.clone().invert(), c0: new THREE.Matrix4(), attrs: b.a || {} };
  }
  for (const b of Object.values(bones)) {
    if (b.parent && bones[b.parent]) {

    } else {

  const box = new THREE.Box3();
  const center = V(), body = new THREE.Box3();
  mut.parts.forEach((p, idx) => {
    const bone = boneOf(p.b);
    const world = partMatrix(p);
    const g = GEO[p.k] || GEO.Block;
    const geo = g.clone().applyMatrix4(bone.restInv.clone().multiply(world));
    const neon = p.m === "Neon";
    const rgb = linearRGB(p.col).map(v => neon ? Math.min(1, v * 1.35) : v);
    const alpha = p.m === "Glass" ? Math.min(1 - p.t, 0.6) : 1 - p.t;
    const n = geo.attributes.position.count, cols = new Float32Array(n * 4);

    const kind = opts.ghost ? "ghost" : neon ? (alpha < 0.98 ? "neonGlass" : "neon") : (alpha < 0.98 ? "glass" : "opaque");

    if (p.t < 0.5 && !opts.ghost) {
      const w = Math.min(0.03, 0.2 * Math.min(...p.s));
      const hull = g.clone().applyMatrix4(bone.restInv.clone().multiply(partMatrix(p, w)));
      const hk = p.b + "|outline";
      if (!buckets.has(hk)) buckets.set(hk, { bone, kind: "outline", list: [] });
      buckets.get(hk).list.push(hull);
    }
  });
  const outlines = [], dyn = [];
  for (const { bone, kind, list, entries } of buckets.values()) {
    if (kind === "outline") for (const gg of list) gg.deleteAttribute("color");
    const mesh = new THREE.Mesh(mergeGeometries(list, false), MAT[kind]);
    if (mut.dyn && kind !== "outline" && entries.some(e => e.info)) dyn.push({ attr: mesh.geometry.attributes.color, entries });
    mesh.castShadow = kind === "opaque";
    mesh.receiveShadow = kind === "opaque";
    if (kind === "outline") { mesh.visible = showOutline; outlines.push(mesh); }
    bone.g.add(mesh);
  }
  body.getCenter(center);

  // Effets attachés aux os
  const fx = { emitters: [], beams: [], trails: [], lights: [] };
  const fxRoot = new THREE.Group();
  const local = (bone, c) => bone.restInv.clone().multiply(cfMatrix(c));
  const noFx = !!opts.ghost;
  for (const e of noFx ? [] : arr(data.fx.emitters).concat(mut.emitters)) {
    const bone = boneOf(e.b);
    const em = new Emitter(e, bone.g, local(bone, e.c));
    fx.emitters.push(em);
    fxRoot.add(em.obj);
  }
  for (const b of noFx ? [] : arr(data.fx.beams).concat(mut.beams)) {
    const b0 = boneOf(b.b0), b1 = boneOf(b.b1);
    const bm = new BeamFx(b, b0.g, local(b0, b.p0), b1.g, local(b1, b.p1));
    fx.beams.push(bm);
    fxRoot.add(bm.obj);
  }
  for (const t of noFx ? [] : arr(data.fx.trails).concat(mut.trails)) {
    const bone = boneOf(t.b);
    const tr = new TrailFx(t, bone.g, V().fromArray(t.p0).applyMatrix4(bone.restInv), V().fromArray(t.p1).applyMatrix4(bone.restInv));

    fxRoot.add(tr.obj);
  }
  for (const l of noFx ? [] : arr(data.fx.lights).slice(0, 6).concat(mut.lights)) {
    const bone = boneOf(l.bone);
    tmpColor.setRGB(l.col[0] / 255, l.col[1] / 255, l.col[2] / 255, THREE.SRGBColorSpace);
    const pl = new THREE.PointLight(tmpColor.clone(), l.b * 2.5, l.range * 1.2, 1);
    pl.position.copy(V().fromArray(l.p).applyMatrix4(bone.restInv));
    bone.g.add(pl);
    fx.lights.push({ light: pl, base: pl.intensity });

  const auras = Object.values(bones).filter(b => b.name.startsWith("Aura")).sort((a, b) => a.name.localeCompare(b.name));
  return {
    data, root, bones, fx, fxRoot, outlines, box, center, abilityOrigin, auras, mut, dyn,
    profile: profileOf(data.anim || {}),
    st: { t: Math.random() * 50, move: 0, earTimer: 1, earSide: 1, sniffTimer: 2, tongueTimer: 1.5, abilityT: -1 },
  };
}

function profileOf(a) {

    gait: a.gait || "Quadruped", breathe: a.breathe ?? 0.03, sway: a.sway ?? 8, tongueFlick: !!a.tongueFlick,
    bob: a.bob ?? 0.08, stride: a.stride ?? 30, strideRate: a.strideRate ?? 10, tailSway: a.tailSway ?? 12,
    tailRate: a.tailRate ?? 2, headLook: a.headLook ?? 15, sniff: !!a.sniff, earTwitch: !!a.earTwitch,

    }
  }

  const ampL = p.flicker > 0 ? p.flicker : 0.08;
  cr.fx.lights.forEach((L, i) => { L.light.intensity = L.base * (1 + ampL * 2 * noise(t * (p.flicker > 0 ? 7 : 1.5), i * 1.7)); });
}

// ---------------------------------------------------------------------------
// Capacités spéciales (version navigateur de Vfx.playAbility)
// ---------------------------------------------------------------------------
const transient = [];
const FRESNEL_V = `varying vec3 vN; varying vec3 vV; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0);
vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const FRESNEL_F = `uniform vec3 color; uniform float opacity; varying vec3 vN; varying vec3 vV;
void main() { float f = pow(1.0 - abs(dot(vN, vV)), 2.2); gl_FragColor = vec4(color, (f * 0.9 + 0.08) * opacity); }`;
function srgbColor(rgb) { return new THREE.Color().setRGB(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255, THREE.SRGBColorSpace); }
function addTransient(obj, duration, update) {
  fxGroup.add(obj);
  transient.push({ obj, t: 0, duration, update });
}
function shockwave(pos, radius, rgb, duration) {
  const mesh = new THREE.Mesh(new THREE.RingGeometry(0.82, 1, 64), new THREE.MeshBasicMaterial({ color: srgbColor(rgb), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.copy(pos);
  addTransient(mesh, duration, k => { const e = 1 - Math.pow(1 - k, 4); mesh.scale.setScalar(0.1 + e * radius); mesh.material.opacity = 1 - k; });
}
function dome(pos, radius, rgb, duration) {
  const mat = new THREE.ShaderMaterial({ uniforms: { color: { value: srgbColor(rgb) }, opacity: { value: 1 } }, vertexShader: FRESNEL_V, fragmentShader: FRESNEL_F, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), mat);
  mesh.position.copy(pos);
  addTransient(mesh, duration, k => { const e = 1 - Math.pow(1 - k, 4); mesh.scale.setScalar(0.2 + e * radius); mat.uniforms.opacity.value = 1 - k; });
}
function flash(pos, radius, rgb, duration) {
  const l = new THREE.PointLight(srgbColor(rgb), 30, radius * 3, 1);
  l.position.copy(pos);
  addTransient(l, duration, k => { l.intensity = 30 * (1 - k); });
}
function seqFromColors(cols) { return cols.map((c, i) => [i / Math.max(cols.length - 1, 1), c[0] / 255, c[1] / 255, c[2] / 255]); }
function oneShot(anchor, local, spec, count) {
  const em = new Emitter(spec, anchor, local);
  em.rate = 0;
  em.burst(count);
  fxGroup.add(em.obj);
  transient.push({ obj: em.obj, t: 0, duration: spec.life[1] + 0.1, update: (k, dt) => { em.step(dt); em.write(pxScale()); } });
  return em;
}
function spec(tex, cols, size, speed, spread, life, acc = [0, 0, 0], rate = 0, burst = 80) {
  return { tex, col: seqFromColors(cols), size: [[0, size], [0.5, size * 0.7], [1, 0]], tr: [[0, 0], [0.5, 0.2], [1, 1]], life: [life * 0.6, life], rate, speed: [speed * 0.6, speed], spread: [spread, spread], acc, drag: 2, le: 1, dir: "Top", s: [0.3, 0.3, 0.3], burst };
}
function playAbility(cr) {
  const a = cr.data.ability;
  if (!a) return;
  cr.st.abilityT = 0;
  const [c1, c2 = c1, c3 = [255, 255, 255]] = a.colors;
  const R = a.radius, dur = a.duration || 1.6;
  const ground = new THREE.Vector3(cr.center.x, 0.06, cr.center.z);
  const body = cr.center.clone();
  const at = p => new THREE.Matrix4().makeTranslation(p.x, p.y, p.z);
  const world = new THREE.Object3D();
  world.updateMatrixWorld();
  if (a.kind === "Breath" && cr.abilityOrigin) {
    const em = new Emitter({ ...spec(a.texture, [c3, c1, c2], 0.4, 18, 12, 0.7, [0, 0, 0], 120, 0), size: [[0, 0.4], [0.5, 1.4], [1, 2.2]] }, cr.abilityOrigin.g, cr.abilityOrigin.local);
    fxGroup.add(em.obj);
    transient.push({ obj: em.obj, t: 0, duration: dur + 0.8, update: (k, dt, t) => { if (t > dur) em.rate = 0; em.step(dt); em.write(pxScale()); } });
    flash(body, R, c1, dur * 0.6);
  } else if (a.kind === "Stomp") {
    shockwave(ground, R, c1, 0.9);
    setTimeout(() => shockwave(ground, R * 0.7, c2, 0.8), 150);
    oneShot(world, at(ground), spec("spark", [c2, c1], 0.3, 14, 70, 1.2, [0, -18, 0]), 40);
    oneShot(world, at(ground), { ...spec("smoke", [[180, 170, 150], c2], 1.6, 6, 85, 1.4), le: 0 }, 20);
    flash(ground, R, c1, 0.6);
  } else if (a.kind === "Burst") {
    dome(body, R * 0.6, c1, 0.7);
    oneShot(world, at(body), spec(a.texture, [c3, c1, c2], 0.35, 16, 180, 1.0), 60);
    shockwave(ground, R, c2, 0.8);
    flash(body, R, c1, 0.7);
  } else if (a.kind === "Eruption") {
    oneShot(world, at(body), spec("fire", [c3, c1, c2], 0.9, 22, 25, 1.4, [0, -14, 0]), 50);
    oneShot(world, at(body), spec("spark", [c3, c1], 0.25, 26, 35, 1.8, [0, -10, 0]), 40);
    shockwave(ground, R, c1, 1.0);
    flash(body, R * 1.5, c1, 1.0);
  } else {
    dome(body, R * 0.8, c1, 0.8);
    setTimeout(() => dome(body, R, c2, 0.9), 120);
    shockwave(ground, R * 1.2, c1, 1.0);
    oneShot(world, at(body), spec(a.texture, [c3, c1, c2], 0.5, 18, 180, 1.2), 70);
    flash(body, R * 1.5, c1, 0.9);
  }
}
function stepTransient(dt) {
  for (let i = transient.length - 1; i >= 0; i--) {
    const tr = transient[i];
    tr.t += dt;
    const k = Math.min(1, tr.t / tr.duration);
    tr.update(k, dt, tr.t);
    if (tr.t >= tr.duration) {
      fxGroup.remove(tr.obj);
      tr.obj.geometry?.dispose();
      transient.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------------------
// Interface
// ---------------------------------------------------------------------------
let index = [];
const cache = new Map();
let currentId = null, currentMutations = [], concepts = [], treadmills = [], ghost = null;
let showFx = true;

function pxScale() {
  return renderer.domElement.height / (2 * Math.tan(rad(camera.fov / 2)));
}

function setAnim(name) {
  animState = name === "Ability" ? animState : name;
  document.querySelectorAll("[data-anim]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.anim === (name === "Ability" ? "Ability" : animState))));
}

function renderList() {
  const zones = document.getElementById("zones");
  zones.innerHTML = "";
  const groups = [];
  if (treadmills.length) groups.push({ label: "Tapis de course", sub: "10 niveaux : plus de vitesse gagnée par seconde", items: treadmills, treadmill: true });
  for (const r of ORDER) {
    const items = index.filter(c => c.rarity === r);
    if (items.length) groups.push({ label: RARITY[r].label, sub: RARITY[r].where, items });
  }
  for (const g of groups) {
    const sec = document.createElement("section");
    sec.className = "zone";
    sec.innerHTML = `<h2>${g.label}<span>${g.sub}</span></h2>`;
    const list = document.createElement("div");
    list.className = "list";
    for (const c of g.items) {
      if (g.treadmill) {
        const b = document.createElement("button");
        b.className = "item";
        b.id = "item-" + c.id;
        b.innerHTML = `<i class="pip" style="background:rgb(${c.color.join(",")})"></i><b>${c.name.replace(/ — niveau \d+$/, "")}</b><small>Niveau ${c.tier} · +${money(c.gain)} vitesse/s · ${c.price ? money(c.price) + " $" : "offert"}</small>`;
        b.onclick = () => { location.hash = c.id; };
        list.appendChild(b);
        continue;
      }
      const r = RARITY[c.rarity] || RARITY.Common;
      const b = document.createElement("button");
      b.className = "item";
      b.id = "item-" + c.id;
      const sub = c.rarity === "Chaotic" ? `${GAIT[c.gait] || ""} · ${money(c.income)} $/s` : `${SIZE[c.size] || ""} · ${money(c.income)} $/s`;
      b.innerHTML = `<i class="pip ${r.cls || ""}" style="background:${r.color}"></i><b>${c.name}</b><small>${sub}</small>`;
      b.onclick = () => { location.hash = c.id; };
      list.appendChild(b);
    }
    sec.appendChild(list);
    zones.appendChild(sec);
  }
}

function renderMutations() {
  const row = document.getElementById("mutations");
  row.innerHTML = "";
  const all = [{ id: "", label: "NORMAL", glow: [220, 220, 235] }, ...mutations];
  for (const m of all) {
    const b = document.createElement("button");
    b.className = "chip";
    b.id = "mut-" + (m.id || "none");
    const on = m.id ? currentMutations.includes(m.id) : currentMutations.length === 0;
    b.setAttribute("aria-pressed", String(on));
    const c = m.badge && m.badge.length > 1 ? `linear-gradient(135deg,${m.badge.map(x => `rgb(${x.join(",")})`).join(",")})` : `rgb(${m.glow.join(",")})`;
    b.title = m.effect ? `${m.effect} · 1 sur ${m.odds.toLocaleString("fr-FR")}` : "Sans mutation";
    b.innerHTML = `<i style="background:${c}"></i>${m.label[0] + m.label.slice(1).toLowerCase()}${m.multiplier ? " ×" + String(m.multiplier).replace(".", ",") : ""}`;
    b.onclick = () => {
      if (!m.id) currentMutations = [];
      else currentMutations = on ? currentMutations.filter(x => x !== m.id) : [...currentMutations, m.id];
      renderMutations();
      show(currentId, true);
    };
    row.appendChild(b);
  }
}

function fit(cr) {
  const size = cr.box.getSize(V()), c = cr.box.getCenter(V());
  const r = Math.max(size.length() / 2, 1);
  const dist = r / Math.sin(rad(camera.fov / 2)) * 0.78;
  const dir = new THREE.Vector3(0.78, 0.42, -1).normalize();
  c.y -= r * 0.18; // la créature remonte à l'écran, au-dessus des commandes
  camera.position.copy(c).addScaledVector(dir, dist);
  controls.target.copy(c);
  controls.update();
}

async function loadData(id) {
  if (!cache.has(id)) cache.set(id, fetch(`${id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));
  return cache.get(id);
}

async function show(id, keepCamera = false) {
  if (!id) return;
  currentId = id;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", String(b.id === "item-" + id)));
  document.getElementById("loading").hidden = false;
  let data;
  try {
    data = await loadData(id);
  } catch (err) {
    document.getElementById("loading").textContent = "Impossible de charger cette créature. Recharge la page.";
    return;
  }
  if (id !== currentId) return;
  if (creature) {
    holder.remove(creature.root);
    fxGroup.remove(creature.fxRoot);
  }
  if (ghost) { holder.remove(ghost.root); ghost = null; }
  creature = buildCreature(data, currentMutations);
  if (creature.mut.echo) {
    // Écho : copie fantôme qui suit avec une seconde de retard
    ghost = buildCreature(data, currentMutations.filter(x => x !== "Echo"), { ghost: true });
    const sz = creature.box.getSize(V());
    ghost.root.position.set(sz.x * 0.25, 0, sz.z * 0.4);
    holder.add(ghost.root);
  }
  holder.add(creature.root);
  creature.fxRoot.visible = showFx;
  fxGroup.add(creature.fxRoot);
  holder.updateMatrixWorld(true);
  for (let k = 0; k < 60; k++) for (const em of creature.fx.emitters) em.step(1 / 30);
  if (!keepCamera) fit(creature);
  const isTread = data.kind === "Treadmill";
  document.getElementById("mutations").hidden = isTread;
  document.querySelector(".seg").hidden = isTread;
  if (isTread) {
    const next = treadmills.find(x => x.tier === data.tier + 1);
    document.getElementById("name").textContent = data.name.replace(/ — niveau \d+$/, "");
    document.getElementById("desc").textContent = data.description || "";
    document.getElementById("tags").innerHTML =
      `<span class="tag rarity" style="background:rgb(${data.color.join(",")})">Tapis · niveau ${data.tier}</span><span class="tag">${data.theme}</span>`;
    document.getElementById("stats").innerHTML =
      `<span><strong>+${money(data.gain)}</strong> vitesse gagnée par seconde</span>` +
      `<span><strong>${data.price ? money(data.price) + " $" : "Offert"}</strong> ${data.price ? "à l'achat" : "(tapis de départ)"}</span>` +
      `<span><strong>${data.parts.length.toLocaleString("fr-FR")}</strong> pièces</span>`;
    document.getElementById("income").textContent = next ? `Niveau suivant : ${next.name.replace(/ — niveau \d+$/, "")} (${money(next.price)} $, +${money(next.gain)} vitesse/s)` : "Le meilleur tapis du jeu";
    document.getElementById("abilityName").textContent = "";
    document.getElementById("loading").hidden = true;
    document.title = `${document.getElementById("name").textContent} · Bestiaire du Tapis`;
    return;
  }
  const meta = index.find(c => c.id === id) || concepts.find(c => c.id === id) || {};
  const rar = RARITY[data.rarity] || RARITY.Common;
  const concept = data.zone === "Concepts";
  document.getElementById("name").textContent = data.name;
  document.getElementById("desc").textContent = data.description || "";
  document.getElementById("tags").innerHTML =
    `<span class="tag rarity ${rar.cls || ""}" style="background:${rar.color}">${concept ? "Variante · Chaotique" : rar.label}</span>` +
    (concept ? "" : `<span class="tag">${SIZE[data.size] || ""}</span><span class="tag">${SOURCE[data.source] || ""}</span>`) +
    `<span class="tag">${GAIT[meta.gait] || GAIT[(data.anim || {}).gait] || ""}</span>`;
  document.getElementById("stats").innerHTML = concept
    ? `<span><strong>${data.parts.length.toLocaleString("fr-FR")}</strong> pièces</span><span>Couronne flottante, corps de vide et d'étoiles</span>`
    : `<span><strong>${money(data.income)} $/s</strong> de base</span>` +
      `<span><strong>+${Math.round(data.speed * 100)} %</strong> de vitesse en monture</span>` +
      `<span><strong>${data.passenger ? "Oui" : "Non"}</strong> passager</span>` +
      `<span><strong>${data.parts.length.toLocaleString("fr-FR")}</strong> pièces</span>`;
  const muts = mutations.filter(m => currentMutations.includes(m.id));
  const multi = muts.length ? muts.reduce((a, m) => a + m.multiplier, 0) : 1;
  document.getElementById("income").textContent = concept ? "" : muts.length
    ? `Revenu : ${money(data.income)} × (${muts.map(m => String(m.multiplier).replace(".", ",")).join(" + ")}) = ${money(data.income * multi)} $/s`
    : `Revenu : ${money(data.income)} $/s (sans mutation)`;
  document.getElementById("abilityName").textContent = data.ability ? `Capacité : ${data.ability.name} (${KIND[data.ability.kind] || data.ability.kind})` : "";
  document.getElementById("loading").hidden = true;
  document.title = `${data.name} · Bestiaire du Tapis`;
}

document.querySelectorAll("[data-anim]").forEach(b => b.onclick = () => {
  if (b.dataset.anim === "Ability") {
    if (creature && creature.st.abilityT < 0) { playAbility(creature); setAnim("Ability"); }
  } else setAnim(b.dataset.anim);
});
const toggle = (id, fn) => {
  const b = document.getElementById(id);
  b.onclick = () => { const v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(v)); fn(v); };
};
toggle("t-vfx", v => { showFx = v; if (creature) creature.fxRoot.visible = v; });
toggle("t-outline", v => { showOutline = v; if (creature) creature.outlines.forEach(o => (o.visible = v)); });
toggle("t-rotate", v => { controls.autoRotate = v; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  controls.update();
  if (creature) {
    stepAnim(creature, dt);
    if (ghost) { ghost.st.t = creature.st.t - 1; ghost.st.move = creature.st.move; stepAnim(ghost, 0); }
    holder.updateMatrixWorld(true);
    if (showFx) {
      const px = pxScale();
      for (const em of creature.fx.emitters) { em.step(dt); em.write(px); }
      for (const bm of creature.fx.beams) bm.update(camera);
      const now = performance.now() / 1000;
      for (const tr of creature.fx.trails) tr.update(now);
    }
  }
  stepTransient(dt);
  renderer.render(scene, camera);
});

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
(async () => {
  try {
    [index, mutations, treadmills] = await Promise.all([
      fetch("index.json").then(r => r.json()),
      fetch("mutations.json").then(r => r.json()),
      fetch("treadmills.json").then(r => (r.ok ? r.json() : [])).catch(() => []),
    ]);
  } catch (err) {
    document.getElementById("loading").textContent = "Impossible de charger le bestiaire. Recharge la page.";
    return;
  }
  renderList();
  renderMutations();
  const start = location.hash.slice(1);
  const known = index.some(c => c.id === start) || treadmills.some(c => c.id === start);
  await show(known ? start : (treadmills[treadmills.length - 1] || index[0]).id);
  window.__ready = true;
})();
</script>
</body>
</html>
