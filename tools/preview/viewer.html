<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatureForge Preview</title>
<style>
  :root { --bg: #eef0f4; --ink: #1d1d24; --muted: #6b6d78; --chip: #ffffff; --chip-on: #1d1d24; }
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; z-index: 2; }
  #bar button { border: 1px solid #c9cad2; background: var(--chip); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #bar button.on { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }
  #bar select { border: 1px solid #c9cad2; border-radius: 6px; padding: 4px 8px; font: inherit; background: #fff; }
  #bar .sep { width: 10px; }
  #info { margin-left: 8px; color: var(--muted); }
  #info b { color: var(--ink); }
  canvas { display: block; }
  #caption { display: none; position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; font: 700 20px system-ui; color: var(--ink); z-index: 2; }
  #caption span { display: block; font: 600 13px system-ui; color: var(--muted); letter-spacing: .08em; }
  body.clean #bar { display: none; }
  body.dark { background: radial-gradient(circle at 50% 40%, #33304a 0%, #14131f 75%); }
  body.dark #caption { color: #f2f0ff; }
  body.dark #caption span { color: #b9b4d6; }
  body.clean #caption { display: block; }
  #icon { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  #card { position: relative; width: min(80vw, 80vh); aspect-ratio: 1; border-radius: 16%; overflow: hidden; box-shadow: 0 0 0 4px #b0b8c4 inset; }
  #card canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .glow { position: absolute; left: 50%; top: 47%; border-radius: 50%; transform: translate(-50%, -50%); }
  #pill { position: absolute; left: 5%; top: 4%; width: 44%; height: 12%; border-radius: 99px; background: linear-gradient(#ecf0f6, #b0b8c4); color: #686e7a; font: 700 4.4vmin system-ui; display: flex; align-items: center; justify-content: center; z-index: 3; }
  #plate { position: absolute; left: 5%; bottom: 5.5%; width: 90%; height: 17%; border-radius: 40%/50%; background: rgba(0,0,0,.55); color: #fff; font: 700 5.6vmin system-ui; display: flex; align-items: center; justify-content: center; z-index: 3; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<div id="bar">
  <button data-view="34" class="on">3/4</button>
  <button data-view="front">Face</button>
  <button data-view="side">Profil</button>
  <button data-view="back">Arrière</button>
  <button data-view="top">Dessus</button>
  <button data-view="icon">Icône</button>
  <span class="sep"></span>
  <button id="outline" class="on">Contours</button>
  <button id="vfx" class="on">VFX</button>
  <select id="mut"><option value="">Normal</option></select>
  <button id="glb">GLB</button>
  <button id="obj">OBJ</button>
  <span id="info">Glissez un .json exporté par <code>lune run tools/export</code> ou ouvrez <code>?id=RatDesCavernes</code></span>
</div>
<div id="caption"></div>
<div id="icon"><div id="card"><div id="pill">COMMUN</div><div id="plate"></div></div></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { OBJExporter } from "three/addons/exporters/OBJExporter.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const params = new URLSearchParams(location.search);
if (params.get("ui") === "0") document.body.classList.add("clean");
if (params.get("bg") === "dark") document.body.classList.add("dark");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8494, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(5, 10, -7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Ombrage cartoon en 3 tons
const toonRamp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter;
toonRamp.needsUpdate = true;

const creature = new THREE.Group();
const outlines = new THREE.Group();
scene.add(creature, outlines);
const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: 0x15131a, side: THREE.BackSide });
let data = null;
let parts = [];
let bounds = new THREE.Box3();
let view = params.get("view") || "34";
outlines.visible = params.get("outline") !== "0";
document.getElementById("outline").classList.toggle("on", outlines.visible);

function wedgeGeometry() {
  const v = [[-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [0.5, -0.5, 0.5], [-0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5]];
  const tris = [[0, 2, 1], [0, 3, 2], [3, 5, 4], [3, 2, 5], [0, 4, 5], [0, 5, 1], [0, 3, 4], [1, 5, 2]];
  const pos = [];
  for (const t of tris) for (const i of t) pos.push(...v[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
const GEO = {
  Block: new THREE.BoxGeometry(1, 1, 1),
  Wedge: wedgeGeometry(),
  Ball: new THREE.IcosahedronGeometry(0.5, 1),
  Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 12).rotateZ(-Math.PI / 2),
};

const srgb = a => new THREE.Color().setRGB(a[0] / 255, a[1] / 255, a[2] / 255, THREE.SRGBColorSpace);

function material(p) {
  const color = srgb(p.col);
  const opts = { color, transparent: p.t > 0, opacity: 1 - p.t };
  if (p.m === "Neon") return new THREE.MeshBasicMaterial({ ...opts, color: color.clone().multiplyScalar(1.3) });
  if (p.m === "Glass") return new THREE.MeshToonMaterial({ ...opts, gradientMap: toonRamp, transparent: true, opacity: Math.min(1 - p.t, 0.65) });
  return new THREE.MeshToonMaterial({ ...opts, gradientMap: toonRamp });
}

function partMatrix(p, grow = 0) {
  const c = p.c;
  const m = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
  let s = p.s;
  if (p.k === "Ball") { const d = Math.min(...s); s = [d, d, d]; }
  if (p.k === "Cylinder") { const d = Math.min(s[1], s[2]); s = [s[0], d, d]; }
  return m.multiply(new THREE.Matrix4().makeScale(s[0] + grow, s[1] + grow, s[2] + grow));
}

// ---- Mutations (même algorithme que src/shared/Mutations.luau) ----
let mutations = [];
let mutation = params.get("mut") || "";
function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
function mutate(p, along) {
  const m = mutations.find(x => x.id === mutation);
  if (!m) return p;
  const [r, g, b] = p.col.map(x => x / 255);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  const neon = p.m === "Neon";
  let col, mat = p.m, t = p.t;
  if (m.rainbow) col = hsv((along * 0.85 + lum * 0.15) % 1, neon ? 0.45 : 0.78, 0.45 + 0.55 * Math.sqrt(lum)).map(x => x * 255);
  else if (neon) col = m.glow;
  else {
    const x = Math.pow(lum, 0.85) * (m.ramp.length - 1), i = Math.min(Math.floor(x), m.ramp.length - 2), f = x - i;
    col = m.ramp[i].map((c, k) => c + (m.ramp[i + 1][k] - c) * f);
  }
  if (m.material && !neon) {
    mat = m.material;
    const l2 = (0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2]) / 255;
    if (m.transparency && l2 > 0.55) t = Math.max(t, m.transparency);
  }
  return { ...p, col, m: mat, t };
}
const mutSelect = document.getElementById("mut");
fetch("mutations.json").then(r => r.json()).then(list => {
  mutations = list;
  for (const m of list) {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = `${m.label} x${m.multiplier}`;
    mutSelect.appendChild(o);
  }
  mutSelect.value = mutation;
}).catch(() => {});
mutSelect.onchange = () => { mutation = mutSelect.value; if (data) load(data); };

// ---- VFX : particules, rayons (Beam), lumières ----
const fxGroup = new THREE.Group();
scene.add(fxGroup);
let fx = { emitters: [], beams: [], lights: [] };
const clock = new THREE.Clock();
const toLinear = v => Math.pow(v, 2.2);

function makeTex(kind) {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = stops => {
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    stops.forEach(([o, col]) => r.addColorStop(o, col));
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
  };
  if (kind === "sparkle") {
    grad([[0, "rgba(255,255,255,1)"], [0.22, "rgba(255,255,255,0.45)"], [1, "rgba(255,255,255,0)"]]);
    g.fillStyle = "rgba(255,255,255,0.95)";
    g.beginPath();
    g.moveTo(32, 2); g.lineTo(35, 29); g.lineTo(62, 32); g.lineTo(35, 35);
    g.lineTo(32, 62); g.lineTo(29, 35); g.lineTo(2, 32); g.lineTo(29, 29);
    g.closePath();
    g.fill();
  } else if (kind === "spark") {
    grad([[0, "rgba(255,255,255,1)"], [0.3, "rgba(255,255,255,0.7)"], [1, "rgba(255,255,255,0)"]]);
  } else if (kind === "fire") {
    grad([[0, "rgba(255,255,255,0.95)"], [0.45, "rgba(255,255,255,0.5)"], [1, "rgba(255,255,255,0)"]]);
  } else {
    grad([[0, "rgba(255,255,255,0.65)"], [0.55, "rgba(255,255,255,0.3)"], [1, "rgba(255,255,255,0)"]]);
  }
  return new THREE.CanvasTexture(c);
}
const PTEX = {};
for (const k of ["sparkle", "spark", "fire", "smoke"]) PTEX[k] = makeTex(k);

const PVERT = `attribute float psize; attribute vec4 pcolor; varying vec4 vColor; uniform float pxScale;
void main() { vColor = pcolor; vec4 mv = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = psize * pxScale / max(-mv.z, 0.01); gl_Position = projectionMatrix * mv; }`;
const PFRAG = `uniform sampler2D map; varying vec4 vColor;
void main() { vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vColor.rgb * t.rgb, vColor.a * t.a); }`;

function evalSeq(seq, t) {
  for (let i = 0; i < seq.length - 1; i++) {
    const a = seq[i], b = seq[i + 1];
    if (t <= b[0]) {
      const f = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
      return a.slice(1).map((v, k) => v + (b[k + 1] - v) * f);
    }
  }
  return seq[seq.length - 1].slice(1);
}
// Les listes vides sont exportées en {} : on les normalise
const toList = x => (Array.isArray(x) ? x : []);
function cfMatrix(c) {
  return new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
}
const DIRS = { Top: [0, 1, 0], Bottom: [0, -1, 0], Front: [0, 0, -1], Back: [0, 0, 1], Right: [1, 0, 0], Left: [-1, 0, 0] };

class Emitter {
  constructor(e) {
    this.e = e;
    this.m = cfMatrix(e.c);
    this.max = Math.max(2, Math.min(700, Math.ceil(e.rate * e.life[1] * 1.3) + 2));
    this.p = [];
    this.acc = 0;
    this.pos = new Float32Array(this.max * 3);
    this.col = new Float32Array(this.max * 4);
    this.size = new Float32Array(this.max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("pcolor", new THREE.BufferAttribute(this.col, 4));
    geo.setAttribute("psize", new THREE.BufferAttribute(this.size, 1));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: PTEX[e.tex] || PTEX.sparkle }, pxScale: { value: 600 } },
      vertexShader: PVERT, fragmentShader: PFRAG, transparent: true, depthWrite: false,
      blending: e.le >= 0.5 ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.obj = new THREE.Points(geo, this.mat);
    this.obj.frustumCulled = false;
    this.dir = new THREE.Vector3(...(DIRS[e.dir] || DIRS.Top)).transformDirection(this.m);
    const ax = new THREE.Vector3(1, 0, 0).transformDirection(this.m);
    const a1 = Math.abs(this.dir.dot(ax)) > 0.9 ? new THREE.Vector3(0, 1, 0).transformDirection(this.m) : ax;
    this.b2 = new THREE.Vector3().crossVectors(this.dir, a1).normalize();
    this.b1 = new THREE.Vector3().crossVectors(this.b2, this.dir).normalize();
  }
  spawn() {
    const e = this.e;
    const pos = new THREE.Vector3((Math.random() - 0.5) * e.s[0], (Math.random() - 0.5) * e.s[1], (Math.random() - 0.5) * e.s[2]).applyMatrix4(this.m);
    const d = this.dir.clone()
      .applyAxisAngle(this.b1, THREE.MathUtils.degToRad(e.spread[0]) * (Math.random() * 2 - 1))
      .applyAxisAngle(this.b2, THREE.MathUtils.degToRad(e.spread[1]) * (Math.random() * 2 - 1));
    const speed = e.speed[0] + Math.random() * (e.speed[1] - e.speed[0]);
    this.p.push({ pos, vel: d.multiplyScalar(speed), age: 0, life: e.life[0] + Math.random() * (e.life[1] - e.life[0]) });
  }
  step(dt) {
    const e = this.e;
    this.acc += e.rate * dt;
    while (this.acc >= 1 && this.p.length < this.max) { this.spawn(); this.acc -= 1; }
    if (this.p.length >= this.max) this.acc = 0;
    const acc = new THREE.Vector3(...e.acc), drag = Math.pow(0.5, e.drag * dt);
    this.p = this.p.filter(q => (q.age += dt) < q.life);
    for (const q of this.p) { q.vel.addScaledVector(acc, dt).multiplyScalar(drag); q.pos.addScaledVector(q.vel, dt); }
  }
  write(pxScale) {
    const e = this.e;
    this.mat.uniforms.pxScale.value = pxScale;
    for (let i = 0; i < this.max; i++) {
      const q = this.p[i];
      if (!q) { this.size[i] = 0; this.col[i * 4 + 3] = 0; continue; }
      const t = q.age / q.life;
      const c = evalSeq(e.col, t);
      this.pos.set([q.pos.x, q.pos.y, q.pos.z], i * 3);
      this.col.set([c[0], c[1], c[2], 1 - evalSeq(e.tr, t)[0]], i * 4);
      this.size[i] = evalSeq(e.size, t)[0];
    }
    const g = this.obj.geometry;
    g.attributes.position.needsUpdate = g.attributes.pcolor.needsUpdate = g.attributes.psize.needsUpdate = true;
  }
}

class BeamFx {
  constructor(b) {
    const P = c => new THREE.Vector3(c[0], c[1], c[2]);
    const axis = c => new THREE.Vector3(c[3], c[6], c[9]);
    const p0 = P(b.p0), p1 = P(b.p1);
    this.curve = new THREE.CubicBezierCurve3(p0, p0.clone().addScaledVector(axis(b.p0), b.curve[0]), p1.clone().addScaledVector(axis(b.p1), -b.curve[1]), p1);
    this.n = b.curve[0] || b.curve[1] ? 24 : 2;
    this.b = b;
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(this.n * 6);
    this.col = new Float32Array(this.n * 8);
    const idx = [];
    for (let i = 0; i < this.n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    geo.setIndex(idx);
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(this.col, 4));
    for (let i = 0; i < this.n; i++) {
      const t = i / (this.n - 1), c = evalSeq(b.col, t), a = 1 - evalSeq(b.tr, t)[0];
      for (const k of [0, 1]) this.col.set([toLinear(c[0]), toLinear(c[1]), toLinear(c[2]), a], (i * 2 + k) * 4);
    }
    this.obj = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: b.le >= 0.5 ? THREE.AdditiveBlending : THREE.NormalBlending,
    }));
    this.obj.frustumCulled = false;
  }
  update(cam) {
    for (let i = 0; i < this.n; i++) {
      const t = i / (this.n - 1);
      const p = this.curve.getPoint(t), tan = this.curve.getTangent(t);
      const side = new THREE.Vector3().crossVectors(tan, cam.position.clone().sub(p)).normalize()
        .multiplyScalar((this.b.w[0] + (this.b.w[1] - this.b.w[0]) * t) / 2);
      this.pos.set([p.x + side.x, p.y + side.y, p.z + side.z, p.x - side.x, p.y - side.y, p.z - side.z], i * 6);
    }
    this.obj.geometry.attributes.position.needsUpdate = true;
  }
}

function buildFx(data) {
  fxGroup.clear();
  fx = { emitters: [], beams: [], lights: [] };
  if (!data) return;
  for (const e of toList(data.emitters)) { const em = new Emitter(e); fx.emitters.push(em); fxGroup.add(em.obj); }
  for (const b of toList(data.beams)) { const bm = new BeamFx(b); fx.beams.push(bm); fxGroup.add(bm.obj); }
  for (const l of toList(data.lights).slice(0, 6)) {
    const pl = new THREE.PointLight(srgb(l.col), l.b * 2.5, l.range * 1.2, 1);
    pl.position.set(...l.p);
    fx.lights.push(pl);
    fxGroup.add(pl);
  }
  for (let k = 0; k < 90; k++) for (const em of fx.emitters) em.step(1 / 30); // préchauffage
}
function stepFx(dt) {
  if (!fxGroup.visible) return;
  const h = renderer.domElement.height;
  const pxScale = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  for (const em of fx.emitters) { em.step(dt); em.write(pxScale); }
  for (const bm of fx.beams) bm.update(camera);
}

function load(json) {
  data = json;
  const zs = json.parts.map(p => p.c[2]);
  const zMin = Math.min(...zs), zMax = Math.max(...zs);
  creature.clear();
  outlines.clear();
  parts = [];
  for (const p0 of json.parts) {
    const p = mutate(p0, (p0.c[2] - zMin) / Math.max(zMax - zMin, 0.01));
    const geo = GEO[p.k] || GEO.Block;
    const mesh = new THREE.Mesh(geo, material(p));
    mesh.matrixAutoUpdate = false;
    mesh.matrix.copy(partMatrix(p));
    mesh.castShadow = p.m !== "Neon";
    mesh.receiveShadow = true;
    creature.add(mesh);
    parts.push({ p, mesh });
    if (p.t < 0.5) {
      const w = Math.min(0.03, 0.2 * Math.min(...p.s));
      const hull = new THREE.Mesh(geo, OUTLINE_MAT);
      hull.matrixAutoUpdate = false;
      hull.matrix.copy(partMatrix(p, w));
      outlines.add(hull);
    }
  }
  creature.updateMatrixWorld(true);
  buildFx(json.fx);
  bounds = new THREE.Box3().setFromObject(creature);
  const tris = json.parts.reduce((n, p) => n + ({ Block: 12, Wedge: 8, Ball: 80, Cylinder: 48 }[p.k] || 12), 0);
  document.getElementById("info").innerHTML =
    `<b>${json.name}</b> · ${json.rarity} · ${json.parts.length} pièces · ${tris} tris · ` +
    `${(bounds.max.y - bounds.min.y).toFixed(1)} st de haut · ${(bounds.max.z - bounds.min.z).toFixed(1)} st de long`;
  document.getElementById("plate").textContent = json.name;
  const mut = mutations.find(x => x.id === mutation);
  document.getElementById("caption").innerHTML = `${json.name}<span>${mut ? mut.label + " x" + mut.multiplier : json.rarity.toUpperCase()}</span>`;
  setView(view);
}

function fit(dir) {
  const center = bounds.getCenter(new THREE.Vector3());
  const radius = bounds.getSize(new THREE.Vector3()).length() / 2;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.8;
  camera.position.copy(center).add(dir.clone().normalize().multiplyScalar(dist));
  controls.target.copy(center);
  camera.lookAt(center);
}

function setView(v) {
  view = v;
  document.querySelectorAll("#bar button[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const iconMode = v === "icon";
  document.getElementById("icon").style.display = iconMode ? "flex" : "none";
  ground.visible = !iconMode;
  if (iconMode) {
    document.getElementById("card").appendChild(renderer.domElement);
    const ic = data.icon;
    const card = document.getElementById("card");
    const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
    card.style.background = `linear-gradient(${rgb(ic.top)}, ${rgb(ic.bottom)})`;
    card.querySelectorAll(".glow").forEach(e => e.remove());
    for (const [size, alpha] of [[92, 0.1], [68, 0.18], [44, 0.28]]) {
      const g = document.createElement("div");
      g.className = "glow";
      g.style.cssText = `width:${size}%;height:${size}%;background:rgba(${ic.glow.join(",")},${alpha})`;
      card.prepend(g);
    }
    const c = ic.camera;
    const m = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
    camera.fov = ic.fov;
    m.decompose(camera.position, camera.quaternion, camera.scale);
    controls.enabled = false;
  } else {
    document.body.appendChild(renderer.domElement);
    camera.fov = 30;
    controls.enabled = true;
    const dirs = {
      "34": new THREE.Vector3(0.75, 0.45, -1),
      front: new THREE.Vector3(0, 0.18, -1),
      side: new THREE.Vector3(1, 0.15, 0),
      back: new THREE.Vector3(-0.7, 0.5, 1),
      top: new THREE.Vector3(0.0001, 1, -0.05),
    };
    fit(dirs[v] || dirs["34"]);
  }
  resize();
}

function resize() {
  const el = view === "icon" ? document.getElementById("card") : document.body;
  const w = el.clientWidth || innerWidth, h = el.clientHeight || innerHeight;
  renderer.setSize(w, h, view !== "icon");
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
document.querySelectorAll("#bar button[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.getElementById("vfx").onclick = e => {
  fxGroup.visible = !fxGroup.visible;
  e.target.classList.toggle("on", fxGroup.visible);
};
document.getElementById("outline").onclick = e => {
  outlines.visible = !outlines.visible;
  e.target.classList.toggle("on", outlines.visible);
};

// ---- Export : un maillage par matériau Roblox, couleurs par sommet ----
function exportScene() {
  const groups = new Map();
  for (const { p, mesh } of parts) {
    let g = (mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry.clone());
    g.deleteAttribute("uv");
    g.applyMatrix4(mesh.matrix);
    const col = srgb(p.col);
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) arr.set([col.r, col.g, col.b], i * 3);
    g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    if (!groups.has(p.m)) groups.set(p.m, []);
    groups.get(p.m).push(g);
  }
  const out = new THREE.Scene();
  for (const [mat, list] of groups) {
    const mesh = new THREE.Mesh(mergeGeometries(list), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, name: mat }));
    mesh.name = `${data.id}_${mat}`;
    out.add(mesh);
  }
  return out;
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("glb").onclick = () => {
  new GLTFExporter().parse(exportScene(), r => download(new Blob([r], { type: "model/gltf-binary" }), `${data.id}.glb`), console.error, { binary: true });
};
document.getElementById("obj").onclick = () => {
  download(new Blob([new OBJExporter().parse(exportScene())], { type: "text/plain" }), `${data.id}.obj`);
};

addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) load(JSON.parse(await f.text()));
});

renderer.setAnimationLoop(() => {
  if (view !== "icon") controls.update();
  stepFx(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
});

const id = params.get("id");
if (id) fetch("mutations.json").then(r => r.json()).catch(() => []).then(list => { mutations = list; })
  .then(() => fetch(`${id}.json`)).then(r => r.json()).then(load).then(() => (window.__ready = true));
</script>
